<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>触感 · 手机预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e9ecf3;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#50596c}header{height:56px;display:flex;align-items:center;justify-content:center;gap:12px}button{background:#fff8;color:#596375;border:0;border-radius:20px;padding:9px 17px;cursor:pointer}button.active{background:#fff;color:#282f3b;box-shadow:0 3px 16px #44557713}#area{height:calc(100dvh - 56px);position:relative;overflow:hidden}#device{position:absolute;left:50%;top:50%;border:1px solid #7e899755;border-radius:30px;overflow:hidden;box-shadow:0 18px 70px #18284b20;background:#08090c}iframe{display:block;border:0;width:100%;height:100%}</style><header><span>触感 · 手机版</span><button class="active" data-mode="portrait">竖屏</button><button data-mode="landscape">横屏</button></header><div id="area"><div id="device"><iframe src="/" title="手机版 App 预览" allow="camera 'self'"></iframe></div></div><script>let mode='portrait';function fit(){const w=mode==='portrait'?390:844,h=mode==='portrait'?844:390,scale=Math.min((innerWidth-24)/w,(innerHeight-80)/h,1),d=document.querySelector('#device');d.style.width=w+'px';d.style.height=h+'px';d.style.transform='translate(-50%,-50%) scale('+scale+')';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));fit();});addEventListener('resize',fit);fit();</script></html>
